# project.yml — XcodeGen spec for Glance
# Signed with team HSQ5A6CT2U (Ruminate). IDs match what is registered with Apple:
# app com.ruminate.glance, widget com.ruminate.glance.widget, group group.com.ruminate.glance.

name: Glance
options:
  bundleIdPrefix: com.ruminate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  useBaseInternationalization: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HSQ5A6CT2U
    CODE_SIGN_STYLE: Automatic

# MARK: - Targets

targets:

  # ─── Main iPhone app ───────────────────────────────────────────────────────
  Glance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Glance/Sources
      - path: GlanceShared/Sources
      - path: GlanceShared/Fonts      # Cabin Sketch (OFL); every file listed in UIAppFonts
        buildPhase: resources
      - path: Glance/Resources/PrivacyInfo.xcprivacy   # Apple privacy manifest (UserDefaults reasons)
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruminate.glance
        INFOPLIST_FILE: Glance/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSET_CATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    entitlements:
      path: Glance/Resources/Glance.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ruminate.glance
    dependencies:
      - target: GlanceWidgetExtension
    scheme:
      testTargets:
        - GlanceTests

  # ─── Widget extension ──────────────────────────────────────────────────────
  GlanceWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GlanceWidgetExtension/Sources
      - path: GlanceShared/Sources
      - path: GlanceShared/Fonts
        buildPhase: resources
      - path: GlanceWidgetExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Glance/Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruminate.glance.widget
        INFOPLIST_FILE: GlanceWidgetExtension/Info.plist
    entitlements:
      path: GlanceWidgetExtension/GlanceWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ruminate.glance

  # ─── Unit tests ────────────────────────────────────────────────────────────
  GlanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GlanceTests
    dependencies:
      - target: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruminate.glance.tests
        INFOPLIST_FILE: GlanceTests/Info.plist

# MARK: - Schemes

schemes:
  Glance:
    build:
      targets:
        Glance: all
        GlanceWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true      # ⌘U in Xcode also shows coverage (Report navigator → Coverage)
      coverageTargets:
        - Glance
      targets:
        - GlanceTests
    archive:
      config: Release
